# Render blueprint for the API (api.brahmamudi.com). The frontend stays on
# Vercel; Postgres is on Neon and uploads on Cloudflare R2, so this service
# keeps nothing on its own disk. Every push to master redeploys it.
#
# Secrets are marked sync: false - Render asks for them when the blueprint is
# first applied and they're never stored in this file.
services:
  - type: web
    name: brahmamudi-api
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    branch: master
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py seed_reference &&
      python manage.py ensure_superuser &&
      python manage.py ensure_staff_admin &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: api.brahmamudi.com,brahmamudi-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://api.brahmamudi.com,https://brahmamudi.com,https://www.brahmamudi.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://brahmamudi.com,https://www.brahmamudi.com
      - key: FRONTEND_BASE_URL
        value: https://brahmamudi.com
      - key: BACKEND_BASE_URL
        value: https://api.brahmamudi.com
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STAFF_ADMIN_EMAIL
        sync: false
      - key: STAFF_ADMIN_PASSWORD
        sync: false
      - key: R2_BUCKET
        value: brahmamudi-media
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
